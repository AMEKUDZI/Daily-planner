{% extends "base.html" %}
{% block title %}Password updated — Daily Planner{% endblock %}
{% block auth_content %}

<div class="auth-card" style="text-align:center;">
    <div class="auth-logo" style="justify-content:center;"><span class="auth-logo-dot"></span>Daily Planner</div>
    <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="var(--green)" stroke-width="1.5" style="margin:0 auto 18px;"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
    <h1 style="margin-bottom:8px;">Password updated</h1>
    <p class="auth-sub">Your password has been set. You can now sign in.</p>
    <a href="{% url 'login' %}" class="btn btn-full" style="margin-top:4px;">Sign in</a>
</div>

{% endblock %}
