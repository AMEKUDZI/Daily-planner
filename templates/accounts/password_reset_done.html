{% extends "base.html" %}
{% block title %}Check your email — Daily Planner{% endblock %}
{% block auth_content %}

<div class="auth-card" style="text-align:center;">
    <div class="auth-logo" style="justify-content:center;"><span class="auth-logo-dot"></span>Daily Planner</div>
    <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="var(--green)" stroke-width="1.5" style="margin:0 auto 18px;"><rect x="2" y="4" width="20" height="16" rx="2"/><polyline points="2,4 12,13 22,4"/></svg>
    <h1 style="margin-bottom:8px;">Check your email</h1>
    <p class="auth-sub">If an account exists for that address, a reset link has been sent. Check your inbox and spam folder.</p>
    <div class="auth-foot"><a href="{% url 'login' %}">Back to sign in</a></div>
</div>

{% endblock %}
